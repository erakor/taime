name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    uses: erakor/toolchain/.github/workflows/node-checks.yml@1c7c1111a17a5b01999b98616554611d605b7339 # v1.5.0 once tagged

  # Storybook is how the themes are reviewed: it must build, and every story must render.
  storybook:
    uses: erakor/toolchain/.github/workflows/storybook-checks.yml@1c7c1111a17a5b01999b98616554611d605b7339 # v1.5.0 once tagged
